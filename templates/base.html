<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Lost & Found Matcher
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <nav>

        <h2>
            Lost & Found Matcher
        </h2>

        <div>

            <a href="{{ url_for('index') }}">
                Home
            </a>

            <a href="{{ url_for('report', report_type='lost') }}">
                Report Lost
            </a>

            <a href="{{ url_for('report', report_type='found') }}">
                Report Found
            </a>

            <a href="{{ url_for('search') }}">
                Search
            </a>

        </div>

    </nav>

    <main>

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
